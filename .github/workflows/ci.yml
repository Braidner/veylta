name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: family_health
          POSTGRES_USER: family_health
          POSTGRES_PASSWORD: family_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_health -d family_health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://family_health:family_health@127.0.0.1:5432/family_health
      OBJECT_STORAGE_ROOT: .local/storage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm license:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm db:rollback
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm test:e2e
